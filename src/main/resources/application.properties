# Application Configuration
spring.application.name=nominatim-geolocalizacion-api
server.port=${SERVER_PORT:8080}
spring.main.banner-mode=off

# Nominatim Configuration
nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
nominatim.user-agent=${NOMINATIM_USER_AGENT:nominatim-geolocalizacion-api/1.0 (contacto@ejemplo.com)}
nominatim.timeout=5000

# Logging Configuration
logging.level.root=WARN
logging.level.com.ejemplo.nominatimgeolocalizacionapi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Static Resources
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true